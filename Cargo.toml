# A workspace: generic review crates (`crates/review-*`) that any frontend can
# reuse, and one binary (`crates/jpr-review`) that wires them together for the
# Neovim plugin. The dependency rule is in docs/architecture.md.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.5.2"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
# Line and word diffs: Histogram for lines (as git), Myers for words. Only the
# slice API is used, so the text helpers stay off.
similar = { version = "3", default-features = false, features = ["std"] }
# Raw-mode terminal input and ANSI control for the interactive CLI palette (`cli-tui`).
crossterm = "0.28"
cli-tui = { path = "crates/cli-tui" }
review-model = { path = "crates/review-model" }
review-core = { path = "crates/review-core" }
review-diff = { path = "crates/review-diff" }
review-store-fs = { path = "crates/review-store-fs" }
review-forge-github = { path = "crates/review-forge-github" }
review-workspace-git = { path = "crates/review-workspace-git" }
review-rpc = { path = "crates/review-rpc" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Help and about strings would render literal backticks in a terminal.
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
